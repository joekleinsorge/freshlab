---
- name: Verify Ubuntu 26.04 LTS
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] is version('26.04', '==')
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Freshlab supports Ubuntu Server 26.04 LTS on amd64 only.
      Found {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} on
      {{ ansible_facts['architecture'] }}.
  tags: ['preflight']

- name: Install Ubuntu host dependencies
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
      - ca-certificates
      - conntrack
      - cryptsetup
      - curl
      - dmsetup
      - ethtool
      - ipset
      - iptables
      - logrotate
      - nfs-common
      - open-iscsi
      - socat
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  tags: ['packages']

- name: Enable iSCSI for Longhorn volumes
  ansible.builtin.systemd_service:
    name: iscsid
    state: started
    enabled: true
  tags: ['storage']

- name: Check for active multipath devices
  ansible.builtin.command: multipath -ll
  register: multipath_devices
  changed_when: false
  check_mode: false
  tags: ['storage']

- name: Refuse to disable multipath when devices are configured
  ansible.builtin.assert:
    that:
      - multipath_devices.stdout | trim == ''
    fail_msg: >-
      Multipath devices are configured on this host. Review its storage layout
      before disabling multipathd for Longhorn.
  tags: ['storage']

- name: Disable multipath services that conflict with Longhorn
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - multipathd.service
    - multipathd.socket
  tags: ['storage']

- name: Pre-flight system checks
  block:
    - name: Check system memory
      ansible.builtin.shell: free -b | awk '/^Mem:/{print $2}'
      register: total_memory
      changed_when: false
      check_mode: false

    - name: Check CPU cores
      ansible.builtin.command: nproc
      register: cpu_cores
      changed_when: false
      check_mode: false

    - name: Check available disk space
      ansible.builtin.shell: df -B1 / | awk 'NR==2 {print $4}'
      register: available_space
      changed_when: false
      check_mode: false

    - name: Verify minimum system requirements
      ansible.builtin.assert:
        that:
          - total_memory.stdout | int >= 4294967296
          - cpu_cores.stdout | int >= 2
          - available_space.stdout | int >= 21474836480
        fail_msg: "System does not meet minimum requirements: 4GB RAM, 2 CPU cores, 20GB free disk space."
  tags: ['preflight']

- name: Disable UFW for Cilium-managed cluster networking
  community.general.ufw:
    state: disabled
  tags: ['security', 'network']

- name: Seed Cilium CNI configuration for new nodes
  block:
    - name: Ensure the host CNI configuration directory exists
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the initial Cilium CNI configuration if missing
      ansible.builtin.copy:
        dest: /etc/cni/net.d/05-cilium.conflist
        owner: root
        group: root
        mode: '0644'
        force: false
        content: |
          {
            "cniVersion": "1.0.0",
            "name": "cilium",
            "plugins": [
              {
                "enable-debug": false,
                "log-file": "/var/run/cilium/cilium-cni.log",
                "type": "cilium-cni"
              }
            ]
          }
  tags: ['network', 'kubernetes']

- name: Load required Kubernetes kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - dm_crypt
    - iscsi_tcp
    - overlay
  tags: ['kernel', 'kubernetes']

- name: Ensure Kubernetes kernel modules load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      dm_crypt
      iscsi_tcp
      overlay
    owner: root
    group: root
    mode: '0644'
  tags: ['kernel', 'kubernetes']

- name: Configure sysctl for Kubernetes
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ k8s_sysctl_params }}"
  vars:
    k8s_sysctl_params:
      - { name: 'fs.inotify.max_queued_events', value: '16384' }
      - { name: 'fs.inotify.max_user_instances', value: '8192' }
      - { name: 'fs.inotify.max_user_watches', value: '524288' }
      - { name: 'vm.swappiness', value: '0' }
      - { name: 'vm.panic_on_oom', value: '0' }
      - { name: 'kernel.panic', value: '10' }
      - { name: 'kernel.panic_on_oops', value: '1' }
      - { name: 'fs.file-max', value: '2097152' }
      - { name: 'fs.nr_open', value: '2097152' }
      - { name: 'net.ipv4.ip_forward', value: '1' }
      - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
      - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
      - { name: 'net.ipv4.ip_nonlocal_bind', value: '1' }
      - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
      - { name: 'kernel.keys.root_maxkeys', value: '1000000' }
  tags: ['sysctl', 'kubernetes']

- name: Manage swap
  block:
    - name: Check if swap is enabled
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false
      check_mode: false

    - name: Disable swap in the running system
      ansible.builtin.command: swapoff -a
      when: swap_status.stdout != ''
      changed_when: true

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s.*)'
        replace: '# \1'
        backup: true
  tags: ['swap']

- name: Configure persistent system logging
  block:
    - name: Ensure persistent journal storage exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: '2755'

    - name: Ensure journald configuration directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Set persistent journal size limits
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/limit-size.conf
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=200M
          RuntimeMaxUse=100M
          MaxRetentionSec=1week
          SystemMaxFileSize=50M
        owner: root
        group: root
        mode: '0644'
      register: journald_config

    - name: Restart journald when its configuration changes
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
      when: journald_config.changed
  tags: ['logs']

- name: Verify Kubernetes API port availability
  block:
    - name: Gather service facts for k3s port validation
      ansible.builtin.service_facts:

    - name: Check whether port 6443 is available
      ansible.builtin.wait_for:
        port: 6443
        timeout: 1
        state: stopped
      register: port_check
      ignore_errors: true

    - name: Reject a non-k3s process on port 6443
      ansible.builtin.assert:
        that:
          - >-
            port_check is success or
            (ansible_facts.services.get('k3s.service', {}).state | default('')) == 'running'
        msg: "Port 6443 is already in use by a non-k3s process."
  tags: ['network']
