---
- name: Apply Netplan DNS configuration
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Load hardware watchdog module
  ansible.builtin.command: modprobe {{ freshlab_watchdog_module }}
  changed_when: true

- name: Reexecute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true
