all:
  vars:
    control_plane_endpoint: 192.168.1.200
    # The cluster already exists.  All control-plane nodes, including metal1,
    # must rejoin through the VIP if their local etcd copy is rebuilt.
    k3s_initial_bootstrap: false
    ingress_load_balancer_ip: 192.168.1.227
    load_balancer_ip_pool:
      - 192.168.1.224/27
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
metal:
  children:
    masters:
      hosts:
        metal1:
          ansible_host: 192.168.1.101
          disk: nvme0n1
          network_interface: enp2s0
          # The former Fedora LV is now a dedicated low-latency etcd volume.
          k3s_datastore_mount_src: LABEL=k3s-etcd
        metal2: {ansible_host: 192.168.1.102, disk: nvme0n1, network_interface: enp2s0}
        metal3: {ansible_host: 192.168.1.103, disk: nvme0n1, network_interface: enp2s0}
    workers:
      hosts:
        metal0: {ansible_host: 192.168.1.100, disk: sda, network_interface: enp1s0}
