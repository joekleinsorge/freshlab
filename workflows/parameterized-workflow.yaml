apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parameterized-workflow-
spec:
  entrypoint: run
  arguments:
    parameters:
      - name: app
        value: freshlab
      - name: env
        value: dev
  templates:
    - name: run
      container:
        image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command: [sh, -c]
        args:
          - |
            echo "Running app={{workflow.parameters.app}} in env={{workflow.parameters.env}}"
