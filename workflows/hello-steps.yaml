apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hello-steps-
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: say-hello
            template: echo
            arguments:
              parameters:
                - name: message
                  value: hello from step 1
        - - name: say-goodbye
            template: echo
            arguments:
              parameters:
                - name: message
                  value: goodbye from step 2

    - name: echo
      inputs:
        parameters:
          - name: message
      container:
        image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command: [sh, -c]
        args: ["echo {{inputs.parameters.message}}"]
