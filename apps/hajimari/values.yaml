hajimari:
  env:
    TZ: America/New_York
  persistence:
    data:
      enabled: false
  ingress:
    main:
      enabled: true
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        hajimari.io/enable: 'false'
      hosts:
        - host: &host home.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: hajimari-tls-certificate
          hosts:
            - *host
  hajimari:
    name: Joe
    title: Home
    lightTheme: chalk
    darkTheme: horizon
    showAppUrls: true
    showAppInfo: true
    showAppStatus: true
    customThemes:
      - name: danger
        backgroundColor: '#0c0e0c'
        primaryColor: '#eaebea'
        accentColor: '#d8323c'
    # Discover explicitly annotated Ingresses; customApps below covers the
    # public HTTPRoutes that Hajimari cannot discover.
    defaultEnable: false
    namespaceSelector:
      any: true
    customApps:
      - group: Applications
        apps:
          - name: Disney Alerts
            url: https://disney-alerts.kleinsorge.dev
            icon: mdi:ticket
          - name: FreshRSS
            url: https://rss.kleinsorge.dev
            icon: mdi:rss
          - name: Kindle Weather
            url: https://kindle-weather.kleinsorge.dev
            icon: mdi:weather-partly-cloudy
          - name: Kiali
            url: https://kiali.kleinsorge.dev
            icon: mdi:topology
          - name: NGINX Web
            url: https://web.kleinsorge.dev
            icon: simple-icons:nginx
          - name: Plex
            url: https://plex.kleinsorge.dev
            icon: simple-icons:plex
    globalBookmarks:
      - group: Homelab
        bookmarks:
          - name: Public GitHub repository
            url: https://github.com/joekleinsorge/freshlab
          - name: Hardware
            url: https://192.168.1.101:9090
