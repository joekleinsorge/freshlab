hajimari:
  env:
    TZ: America/New_York
  persistence:
    data:
      enabled: false
  ingress:
    main:
      enabled: true
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        hajimari.io/enable: 'false'
      hosts:
        - host: &host home.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: hajimari-tls-certificate
          hosts:
            - *host
  hajimari:
    name: Joe
    title: Home
    lightTheme: chalk
    darkTheme: horizon
    showGreeting: false
    showAppGroups: true
    showAppUrls: false
    showAppInfo: false
    showAppStatus: false
    showGlobalBookmarks: false
    defaultSearchProvider: ''
    searchProviders: []
    groups: []
    customThemes:
      - name: danger
        backgroundColor: '#0c0e0c'
        primaryColor: '#eaebea'
        accentColor: '#d8323c'
    defaultEnable: false
    namespaceSelector:
      matchNames:
        - hajimari
    customApps:
      - group: Media
        apps:
          - name: Plex
            url: https://plex.kleinsorge.dev
            icon: mdi:play-box-multiple
          - name: Seerr
            url: https://seerr.kleinsorge.dev
            icon: mdi:movie-search
