apiVersion: apps/v1
kind: Deployment
metadata:
  name: disney-alerts
  namespace: disney-alerts
  labels:
    app: disney-alerts
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: disney-alerts
  template:
    metadata:
      labels:
        app: disney-alerts
    spec:
      automountServiceAccountToken: false
      # The app runs as PID 1 and never reaps Chrome's children; 18k zombies
      # exhausted the pod PID limit and silently stopped checks (2026-10-07).
      # A shared namespace makes the pause container PID 1, which reaps them.
      shareProcessNamespace: true
      # Same class as Plex/Frigate: they preempted this pod on 2026-10-05, and a
      # missed Disney opening is worse than a delayed transcode.
      priorityClassName: freshlab-media-critical
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        kubernetes.io/arch: amd64
      # metal0 is the only non-control-plane node, so Chrome belongs there rather
      # than beside etcd (metal3 went NotReady minutes after this pod landed on it,
      # 2026-11-23). It was avoided from 2026-11-23 to 2026-11-24 while Chrome
      # crashed with SIGILL there; after image GC re-fetched the layers, every launch
      # on all 8 CPUs passed. Preferred, not required, so another node still works.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["metal0"]
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - if [ ! -f /data/config.yaml ]; then cp /seed/config.yaml /data/config.yaml; fi; chmod 664 /data/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed-config
              mountPath: /seed
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/joekleinsorge/disney-availability-alerts@sha256:76d530a5f5df604cf20e5c9e4ed50ae30ad0a8e6ae4e8d3c31426c5795577965
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DISNEY_ALERTS_CONFIG
              value: /data/config.yaml
            - name: STATE_DATABASE
              value: /data/state.db
            - name: DISNEY_BROWSER_STATE
              value: /secrets/disney-storage-state.json
            - name: AVAILABILITY_DAYS
              value: "499"
            - name: AVAILABILITY_REFRESH_SECONDS
              value: "21600"
            - name: AVAILABILITY_REQUEST_DELAY_SECONDS
              value: "0.25"
            - name: AVAILABILITY_REQUEST_CONCURRENCY
              value: "2"
            - name: ALLOWED_WATCH_HOSTS
              value: disneyworld.disney.go.com
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: https://dex.kleinsorge.dev
            - name: OIDC_CLIENT_ID
              value: disney-alerts-sso
            - name: OIDC_REDIRECT_URL
              value: https://disney-alerts.kleinsorge.dev/auth/callback
          envFrom:
            - secretRef:
                name: disney-alerts-secrets
            - secretRef:
                name: disney-alerts-sso
          resources:
            requests:
              cpu: 100m
              # Fits on the two remaining nodes while metal0 is down; real use is
              # ~300-600Mi and the limit below still allows Chrome bursts.
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q -T 3 -O /dev/null http://127.0.0.1:8080/readyz
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          # Startup and readiness don't depend on Disney, so the dashboard stays
          # reachable while searches fail. On 2026-11-18 a startup probe that needed
          # a successful search kept the pod un-Ready for 13 hours.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q -T 3 -O /dev/null http://127.0.0.1:8080/healthz
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          # /livez is 503 when no check has answered (available/unavailable) for
          # LIVENESS_ANSWER_MINUTES (app default 120), counted from process start,
          # and never during a checkout. A Disney outage restarts the container
          # about every two hours; the app also resets Chrome's state itself after
          # a browser crash, which a restart alone did not (2026-11-16, 2026-11-18).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q -T 3 -O /dev/null http://127.0.0.1:8080/livez
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: disney-browser-state
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: disney-alerts-data
        - name: seed-config
          configMap:
            name: disney-alerts-config
        - name: disney-browser-state
          secret:
            secretName: disney-browser-state
            defaultMode: 0440
        - name: tmp
          # Chrome's profile and cache churn here on every check; on the node
          # disk it wrote ~12 MB/s and starved etcd on metal2 (2026-10-05).
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
