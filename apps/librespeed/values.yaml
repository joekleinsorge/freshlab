librespeed:
  image:
    repository: linuxserver/librespeed
    tag: v6.3.1-ls299@sha256:16a2c6a6ba7d60d825d73c682ba3036ca3877fe34f73dab9c88854bc099e1164
  ingress:
    main:
      enabled: false
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        librespeed.io/enable: 'true'
        hajimari.io/appName: LibreSpeed
        hajimari.io/icon: mdi:speedometer
      hosts:
        - host: &host speed.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: librespeed-tls-certificate
          hosts:
            - *host
