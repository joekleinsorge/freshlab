apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: TZ
              value: America/New_York
            - name: BASE_URL
              value: https://mealie.kleinsorge.dev
            - name: ALLOW_SIGNUP
              value: "true"
            - name: ALLOW_PASSWORD_LOGIN
              value: "true"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://dex.kleinsorge.dev/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie-sso
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_PROVIDER_NAME
              value: Dex
            - name: OIDC_AUTO_REDIRECT
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
