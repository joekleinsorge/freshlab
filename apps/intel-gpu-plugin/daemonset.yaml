apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin
    spec:
      priorityClassName: system-node-critical
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.37.1@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33
          imagePullPolicy: IfNotPresent
          args:
            # Plex receives its DRM devices through the Kubernetes device-plugin
            # allocation.  Do not inject individual /dev/dri/by-path symlinks:
            # kubelet cannot create them when the target is already a symlink.
            - -bypath=none
            # Reserve one share for Plex and one for its brief weekly health
            # check. The devices remain scoped to requesting workloads.
            - -shared-dev-num=2
            - -allocation-policy=packed
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfs
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubelet-sockets
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
            type: Directory
        - name: sysfs
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: kubelet-sockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
