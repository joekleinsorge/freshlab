# Pinned digest for the OpenFI build 4cd4698 (round chart axes).
image: "ghcr.io/joekleinsorge/openfi@sha256:1c579007f010795a87b7f626f384fb5adeebcace74e32a40c4bdb50c298884f8"
imagePullSecrets: []
storageClass: longhorn
storageSize: 2Gi
# In-app daily SQLite copies stay off: the ~680 MB database leaves too little room on the
# volume, and VolSync already backs up /data off-node.
