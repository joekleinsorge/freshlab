# Pinned digest for the OpenFI build 26bc60c (checkup moves ranked by earlier full retirement).
image: "ghcr.io/joekleinsorge/openfi@sha256:d12f4f51a35a2d0a89ed3d5624be5bd115a13d5440fdc83602c574f77775ad65"
imagePullSecrets: []
storageClass: longhorn
storageSize: 2Gi
# In-app daily SQLite copies stay off: the ~680 MB database leaves too little room on the
# volume, and VolSync already backs up /data off-node.
dailyBackups: 0
# The private SQLite database is already installed on the retained PVC.
replicas: 1
route:
  enabled: true
  hostname: fi.kleinsorge.dev
  gatewayName: freshlab
  gatewayNamespace: istio-system
  dnsTarget: 192.168.1.228
backup:
  enabled: true
  # Runtime secret provisioned outside Git; keep backup credentials private.
  repositorySecret: openfi-data-volsync-restic
  schedule: "47 2,8,14,20 * * *"
