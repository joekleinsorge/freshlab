# Pinned digest for the OpenFI build 20d491c (hidden checkbox fix).
image: "ghcr.io/joekleinsorge/openfi@sha256:938469dd1ca9ff27b2aec49c3f7f36fb0a94a069f5c2123df9ce89c55b67a54b"
imagePullSecrets: []
storageClass: longhorn
storageSize: 2Gi
# In-app daily SQLite copies stay off: the ~680 MB database leaves too little room on the
