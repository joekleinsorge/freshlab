apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      enableServiceLinks: false
      initContainers:
        - name: configure-platforms
          image: rommapp/romm@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
          command: ["/src/.venv/bin/python", "/bindings/configure.py"]
          volumeMounts:
            - name: config
              mountPath: /romm/config
            - name: platform-bindings
              mountPath: /bindings
              readOnly: true
      containers:
        - name: romm
          image: rommapp/romm@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: DB_PASSWD
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: ROMM_AUTH_SECRET_KEY
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: IGDB_CLIENT_ID
                  optional: true
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: IGDB_CLIENT_SECRET
                  optional: true
            - name: MOBYGAMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: MOBYGAMES_API_KEY
                  optional: true
            - name: STEAMGRIDDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: STEAMGRIDDB_API_KEY
                  optional: true
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: SCREENSCRAPER_USER
                  optional: true
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: SCREENSCRAPER_PASSWORD
                  optional: true
            - name: RETROACHIEVEMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: RETROACHIEVEMENTS_API_KEY
                  optional: true
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: HLTB_API_ENABLED
              value: "true"
            - name: STEAM_API_ENABLED
              value: "true"
            - name: FLASHPOINT_API_ENABLED
              value: "true"
          volumeMounts:
            - name: romm-resources
              mountPath: /romm/resources
            - name: romm-redis-data
              mountPath: /redis-data
            - name: library
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
      volumes:
        - name: platform-bindings
          configMap:
            name: romm-platform-bindings
        - name: romm-resources
          persistentVolumeClaim:
            claimName: romm-resources-pvc
        - name: romm-redis-data
          persistentVolumeClaim:
            claimName: romm-redis-data-pvc
        - name: library
          nfs:
            server: 192.168.1.208
            path: /volume1/Media/Games
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets-pvc
        - name: config
          persistentVolumeClaim:
            claimName: romm-config-recovery-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-db
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: romm-db
  template:
    metadata:
      labels:
        app: romm-db
    spec:
      containers:
        - name: mariadb
          image: mariadb@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: romm
            - name: MARIADB_USER
              value: romm-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
