apiVersion: v1
kind: ConfigMap
metadata:
  name: romm-platform-bindings
data:
  platforms.yaml: |
    game boy: gb
    game boy advance: gba
    game boy color: gbc
    gamecube: ngc
    playstation 2: ps2
    n64: n64
    nes: nes
    snes: snes
    wii: wii
  configure.py: |
    from pathlib import Path

    import yaml

    path = Path("/romm/config/config.yml")
    config = yaml.safe_load(path.read_text()) if path.exists() else {}
    config = config or {}
    bindings = yaml.safe_load(Path("/bindings/platforms.yaml").read_text())
    platforms = config.setdefault("system", {}).setdefault("platforms", {})
    if any(platforms.get(folder) != slug for folder, slug in bindings.items()):
        platforms.update(bindings)
        # Keep the existing file's ownership and permissions on the shared PVC.
        path.write_text(yaml.safe_dump(config, sort_keys=False))
