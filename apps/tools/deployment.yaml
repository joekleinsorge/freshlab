apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools
  labels:
    app: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tools
  template:
    metadata:
      labels:
        app: tools
    spec:
      containers:
      - name: tools
        image: iib0011/omni-tools@sha256:ec5c71c92215ca20b5e7e613941ac603d43625604d02ff07c8e27b7a237980ac
        ports:
        - containerPort: 80
