apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools
  labels:
    app: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tools
  template:
    metadata:
      labels:
        app: tools
    spec:
      containers:
      - name: tools
        image: iib0011/omni-tools@sha256:5a2d3ed5b70d157004826c795618dd1cb61cb9b7dd71847fc7df94187443a018
        ports:
        - containerPort: 80
