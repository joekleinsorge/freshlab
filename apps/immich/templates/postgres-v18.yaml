apiVersion: v1
kind: Service
metadata:
  name: immich-postgres-v18
spec:
  selector:
    app: immich-postgres-v18
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres-v18
spec:
  serviceName: immich-postgres-v18
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres-v18
  template:
    metadata:
      labels:
        app: immich-postgres-v18
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - mkdir -p /var/lib/postgresql/data/pgdata && chown -R 26:999 /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 26
          command: ["sh", "-ec"]
          args:
            - |
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                umask 077
                printf '%s\n' "$POSTGRES_PASSWORD" > /tmp/postgres-password
                initdb -D "$PGDATA" --username="$POSTGRES_USER" --pwfile=/tmp/postgres-password --auth-local=trust --auth-host=scram-sha-256
                rm -f /tmp/postgres-password
              fi
              if ! grep -qF 'host immich immich 10.0.0.0/8 scram-sha-256' "$PGDATA/pg_hba.conf"; then
                printf '%s\n' 'host immich immich 10.0.0.0/8 scram-sha-256' >> "$PGDATA/pg_hba.conf"
              fi
              postgres -D "$PGDATA" \
                -c listen_addresses='*' \
                -c shared_preload_libraries=vchord.so \
                -c 'search_path="$user", public, vectors' \
                -c wal_level=logical &
              postgres_pid=$!
              trap 'kill -TERM "$postgres_pid"; wait "$postgres_pid"' TERM INT
              until pg_isready -U "$POSTGRES_USER" -d postgres >/dev/null 2>&1; do sleep 1; done
              if ! psql -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'immich'" | grep -q 1; then
                createdb -U "$POSTGRES_USER" immich
              fi
              wait "$postgres_pid"
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data-v18
