apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-external-library
data:
  library.json: {{ .Values.externalLibrary | toJson | quote }}
  configure.cjs: |
{{ .Files.Get "files/configure-library.cjs" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-external-library
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: none
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: "{{ .Values.immich.server.controllers.main.containers.main.image.repository }}:{{ .Values.immich.server.controllers.main.containers.main.image.tag }}"
          command: [node, /config/configure.cjs]
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: immich-external-library
        - name: media
          nfs:
            server: {{ .Values.immich.server.persistence.media.server }}
            path: {{ .Values.immich.server.persistence.media.path }}
            readOnly: true
