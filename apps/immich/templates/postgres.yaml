apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-postgres-init
data:
  010-vectorchord.sql: |
    CREATE EXTENSION IF NOT EXISTS vectors;
    CREATE EXTENSION IF NOT EXISTS "vchord";
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
spec:
  selector:
    app: immich-postgres-v18
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres-v16
spec:
  selector:
    app: immich-postgres-v16
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres-v16
spec:
  serviceName: immich-postgres-v16
  replicas: 0
  selector:
    matchLabels:
      app: immich-postgres-v16
  template:
    metadata:
      labels:
        app: immich-postgres-v16
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - mkdir -p /var/lib/postgresql/data/pgdata && chown -R 26:999 /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/tensorchord/cloudnative-vectorchord:16.15-1.1.1@sha256:f5a17fa05faf25e81304ee95e9f920d8ae077ac4a4ef0a1251e09c7197cbb236
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 26
          command: [postgres]
          args:
            - -c
            - shared_preload_libraries=vchord.so
            - -c
            - search_path="$user", public, vectors
            - -c
            - wal_level=logical
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/010-vectorchord.sql
              subPath: 010-vectorchord.sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: init
          configMap:
            name: immich-postgres-init
