externalLibrary:
  name: Synology Memories
  ownerId: b30335ee-0c83-4ea5-a9df-a3c21ecb9544
  importPaths:
    - /media/Memories
  exclusionPatterns:
    - '**/@eaDir/**'
    - '**/#recycle/**'
    - '**/.DS_Store'
    - '**/Thumbs.db'

immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.3.0
          probes:
            startup:
              enabled: true
              spec:
                timeoutSeconds: 10
                failureThreshold: 180
            liveness:
              enabled: true
              spec:
                timeoutSeconds: 10
            readiness:
              enabled: true
              spec:
                timeoutSeconds: 10
          env:
            TZ: America/New_York
            IMMICH_HOST: 0.0.0.0
            DB_HOSTNAME: immich-postgres
            DB_PORT: 5432
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library
    # Managed here instead of the admin UI; a config file makes UI settings read-only.
    configuration:
      storageTemplate:
        enabled: true
      machineLearning:
        duplicateDetection:
          enabled: true
          # Default 0.01 misses re-encoded copies (jpeg/webp pairs measure 0.010-0.09).
          maxDistance: 0.02

  server:
    controllers:
      main:
        replicas: 1
        pod:
          labels:
            istio.io/dataplane-mode: none
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
    persistence:
      media:
        enabled: true
        type: nfs
        server: 192.168.1.208
        path: /volume1/Media
        globalMounts:
          - path: /media
            readOnly: true
    ingress:
      main:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          hajimari.io/appName: Immich
          hajimari.io/icon: simple-icons:immich
        hosts:
          - host: &host photos.kleinsorge.dev
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: immich-tls-certificate
            hosts:
              - *host

  machine-learning:
    controllers:
      main:
        replicas: 1
        pod:
          labels:
            istio.io/dataplane-mode: none
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.6@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2

  valkey:
    enabled: true
