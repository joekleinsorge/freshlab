immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.3.0
          probes:
            startup:
              enabled: true
              spec:
                timeoutSeconds: 10
                failureThreshold: 180
            liveness:
              enabled: true
              spec:
                timeoutSeconds: 10
            readiness:
              enabled: true
              spec:
                timeoutSeconds: 10
          env:
            TZ: America/New_York
            IMMICH_HOST: 0.0.0.0
            DB_HOSTNAME: immich-postgres
            DB_PORT: 5432
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library

  server:
    controllers:
      main:
        replicas: 1
        pod:
          labels:
            istio.io/dataplane-mode: none
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.3@sha256:bae7664ff3aa4c2c1fcbdcdd86b40b105643c5f861f3e6a770fc760089f25862
    persistence:
      media:
        enabled: true
        type: nfs
        server: 192.168.1.208
        path: /volume1/Media
        globalMounts:
          - path: /media
            readOnly: true
    ingress:
      main:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          hajimari.io/appName: Immich
          hajimari.io/icon: simple-icons:immich
        hosts:
          - host: &host photos.kleinsorge.dev
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: immich-tls-certificate
            hosts:
              - *host

  machine-learning:
    controllers:
      main:
        replicas: 1
        pod:
          labels:
            istio.io/dataplane-mode: none
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.3@sha256:73915f07e1f4289ba45b174c58443db74cef47ddf502613f475fc5e52458ea42

  valkey:
    enabled: true
