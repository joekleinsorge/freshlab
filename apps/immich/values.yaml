immich:
  controllers:
    main:
      containers:
        main:
          probes:
            startup:
              enabled: true
              spec:
                timeoutSeconds: 10
                failureThreshold: 60
            liveness:
              enabled: true
              spec:
                timeoutSeconds: 10
            readiness:
              enabled: true
              spec:
                timeoutSeconds: 10
          env:
            TZ: America/New_York
            IMMICH_HOST: 0.0.0.0
            DB_HOSTNAME: immich-postgres
            DB_PORT: 5432
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: postgres-password

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: immich-library

  server:
    ingress:
      main:
        enabled: false
        ingressClassName: istio
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          hajimari.io/appName: Immich
          hajimari.io/icon: simple-icons:immich
        hosts:
          - host: &host photos.kleinsorge.dev
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: immich-tls-certificate
            hosts:
              - *host

  valkey:
    enabled: true
