apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Freshlab
    theme: dark
    color: slate
    layout:
      Media:
        style: row
        columns: 4
      Downloads:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Utilities:
        style: row
        columns: 4
      Tools:
        style: row
        columns: 4
  services.yaml: |
    - Media:
        - Plex:
            icon: plex.svg
            href: https://plex.kleinsorge.dev
        - Seerr:
            icon: jellyseerr.svg
            href: https://seerr.kleinsorge.dev
        - Tautulli:
            icon: tautulli.svg
            href: https://tautulli.kleinsorge.dev
        - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbittorrent.kleinsorge.dev
        - Frigate:
            icon: frigate.svg
            href: https://frigate.kleinsorge.dev
        - Immich:
            icon: immich.svg
            href: https://photos.kleinsorge.dev
        - RomM:
            icon: mdi-gamepad-variant
            href: https://romm.kleinsorge.dev
    - Downloads:
        - Autobrr:
            icon: mdi-download-network
            href: https://autobrr.kleinsorge.dev
        - Prowlarr:
            icon: prowlarr.svg
            href: https://prowlarr.kleinsorge.dev
        - Radarr:
            icon: radarr.svg
            href: https://radarr.kleinsorge.dev
        - Sonarr:
            icon: sonarr.svg
            href: https://sonarr.kleinsorge.dev
    - Infrastructure:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.kleinsorge.dev
        - Kiali:
            icon: kiali.svg
            href: https://kiali.kleinsorge.dev
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://status.kleinsorge.dev
        - Kube Ops View:
            icon: mdi-kubernetes
            href: https://view.kleinsorge.dev
        - Argo CD:
            icon: argo-cd.svg
            href: https://argocd.kleinsorge.dev
    - Utilities:
        - FreshRSS:
            icon: freshrss.svg
            href: https://rss.kleinsorge.dev
        - Hermes:
            icon: mdi-robot
            href: https://hermes.kleinsorge.dev
        - Mealie:
            icon: mealie.svg
            href: https://mealie.kleinsorge.dev
        - Grocy:
            icon: mdi-fridge-outline
            href: https://grocy.kleinsorge.dev
        - Paperless:
            icon: mdi-file-document-outline
            href: https://paperless.kleinsorge.dev
        - Seafile:
            icon: mdi-cloud-outline
            href: https://files.kleinsorge.dev
    - Tools:
        - Excalidraw:
            icon: mdi-drawing
