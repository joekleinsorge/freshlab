apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lan-http
  namespace: kindle-weather
spec:
  podSelector:
    matchLabels:
      app: kindle-weather
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          # NodePort traffic is forwarded to the pod's target port.
          port: 8080
