---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kindle-weather
  labels:
    app: kindle-weather
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: kindle-weather
  strategy:
    blueGreen:
      # Keep the existing public Service as the active endpoint. Rollouts
      # changes its pod-template-hash selector only after the preview is ready.
      activeService: kindle-weather-service
      # This Service is the private validation endpoint for the next version.
      previewService: kindle-weather-preview
      previewReplicaCount: 1
      autoPromotionEnabled: true
      autoPromotionSeconds: 60
      scaleDownDelaySeconds: 30
      scaleDownDelayRevisionLimit: 2
  template:
    metadata:
      labels:
        app: kindle-weather
    spec:
      containers:
      - name: kindle-weather
        image: ghcr.io/joekleinsorge/kindle-weather/kindle-weather:c06da66
        env:
        - name: CACHE_EXPIRATION
          value: "1800"
        - name: CACHE_CLEANUP_INTERVAL
          value: "3600"
        - name: OTEL_SERVICE_NAME
          value: kindle-weather
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=apps,deployment.environment=homelab
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 60
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 60
        volumeMounts:
        - name: secrets
          mountPath: "/etc/secrets"
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: api-keys
