uptime-kuma:
  image:
    repository: louislam/uptime-kuma
    tag: 2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
  persistence:
    data:
      enabled: true
      type: pvc
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 2Gi
      mountPath: /app/data
  ingress:
    main:
      enabled: false
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        uptime-kuma.io/enable: 'true'
        hajimari.io/appName: Uptime Kuma
        hajimari.io/icon: mdi:heart-pulse
      hosts:
        - host: &host status.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: uptime-kuma-tls-certificate
          hosts:
            - *host
