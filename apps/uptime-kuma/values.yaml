uptime-kuma:
  image:
    repository: louislam/uptime-kuma
    tag: 2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
  persistence:
    data:
      enabled: true
      type: pvc
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 2Gi
      mountPath: /app/data
  ingress:
    main:
      enabled: false
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        uptime-kuma.io/enable: 'true'
        hajimari.io/appName: Uptime Kuma
        hajimari.io/icon: mdi:heart-pulse
      hosts:
        - host: &host status.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: uptime-kuma-tls-certificate
          hosts:
            - *host
