uptime-kuma:
  image:
    repository: louislam/uptime-kuma
    tag: 2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
  persistence:
    data:
      enabled: true
      type: pvc
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 2Gi
      mountPath: /app/data
  ingress:
    main:
      enabled: false
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        uptime-kuma.io/enable: 'true'
        hajimari.io/appName: Uptime Kuma
        hajimari.io/icon: mdi:heart-pulse
      hosts:
        - host: &host status.kleinsorge.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: uptime-kuma-tls-certificate
          hosts:
            - *host
