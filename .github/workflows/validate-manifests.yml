name: Validate GitOps manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-gitops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate configuration
        run: npx --yes renovate@44.83.0 renovate-config-validator

      - name: Reject plaintext Kubernetes secret values
        run: |
          ! rg --glob '!freshlab-secrets/*.sops.yaml' \
            'JWT_SECRET_KEY:[[:space:]]*[0-9a-f]{64,}' .

      - name: Render and lint Helm charts
        run: |
          while IFS= read -r chart; do
            chart_dir="$(dirname "$chart")"
            helm dependency build "$chart_dir"
            helm lint "$chart_dir"
            helm template validation "$chart_dir" --namespace validation >/dev/null
          done < <(find apps platform system -name Chart.yaml -not -path '*/charts/*' | sort)

      - name: Check health configuration regressions
        run: |
          ruby test/health/config_test.rb
          python3 test/health/smoke_test.py
          bash -n scripts/cluster-smoke-test

      - name: Check Ansible syntax
        run: ansible-playbook --syntax-check metal/cluster.yml
