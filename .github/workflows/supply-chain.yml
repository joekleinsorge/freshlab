name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-and-sbom:
    name: Scan repository and generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy Kubernetes configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: freshlab.spdx.json
          upload-artifact: false

      - name: Report image digest pinning
        run: ./scripts/check-image-pinning.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freshlab-sbom
          path: freshlab.spdx.json
          if-no-files-found: error

  sign-sbom:
    name: Sign SBOM on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan-and-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: freshlab-sbom

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature freshlab.spdx.json.sig \
            --output-certificate freshlab.spdx.json.pem \
            freshlab.spdx.json
          cosign verify-blob \
            --certificate freshlab.spdx.json.pem \
            --signature freshlab.spdx.json.sig \
            --certificate-identity-regexp 'https://github.com/joekleinsorge/freshlab/.github/workflows/supply-chain.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            freshlab.spdx.json

      - name: Upload signed SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freshlab-signed-sbom
          path: |
            freshlab.spdx.json
            freshlab.spdx.json.sig
            freshlab.spdx.json.pem
