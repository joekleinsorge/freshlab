name: Independent cluster watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a recent successful cluster smoke check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/actions/workflows/cluster-smoke.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty' > /tmp/last-success
          python3 - <<'PY'
          import datetime as dt
          from pathlib import Path
          value = Path('/tmp/last-success').read_text().strip()
          if not value:
              raise SystemExit('No successful cluster smoke check exists. Check the external runner and cluster.')
          age = dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
          if age.total_seconds() > 7200:
              raise SystemExit(f'Cluster health heartbeat is stale ({age}). Check the external runner and cluster.')
          print(f'Last successful cluster health check: {value}')
          PY
