name: Verify monthly backup restore drill

on:
  schedule:
    - cron: "47 20 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, freshlab-ops]
    timeout-minutes: 5
    env:
      KUBECONFIG: /var/lib/freshlab-ops/.kube/config
    steps:
      - name: Require a recent successful application-level restore
        run: |
          kubectl --request-timeout=30s -n argocd get workflows \
            -l workflows.argoproj.io/cron-workflow=freshlab-backup-restore-drill \
            -o json > /tmp/freshlab-restore-results.json
          python3 - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          workflows = json.loads(Path('/tmp/freshlab-restore-results.json').read_text())['items']
          if not workflows:
              raise SystemExit('No restore drill has run. Inspect the Argo CronWorkflow.')
          latest = max(workflows, key=lambda w: w['metadata']['creationTimestamp'])
          if latest.get('status', {}).get('phase') != 'Succeeded':
              raise SystemExit('The latest restore drill did not succeed.')
          finished = dt.datetime.fromisoformat(latest['status']['finishedAt'].replace('Z', '+00:00'))
          if (dt.datetime.now(dt.timezone.utc) - finished).total_seconds() > 35 * 86400:
              raise SystemExit('The latest successful restore drill is older than 35 days.')
          print('Monthly restore, SQLite integrity, and application schema verification succeeded.')
          PY
