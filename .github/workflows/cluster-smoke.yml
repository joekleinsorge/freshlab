name: Cluster smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, freshlab-ops]
    timeout-minutes: 20
    env:
      KUBECONFIG: /var/lib/freshlab-ops/.kube/config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the live cluster and every published route
        run: ./scripts/cluster-smoke-test
