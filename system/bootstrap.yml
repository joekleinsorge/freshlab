- name: Bootstrapping the cluster
  hosts: localhost
  tasks:
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: argocd
        state: present

    - name: Check for the local SOPS age identity
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../key.txt"
      register: sops_age_identity

    - name: Require the local SOPS age identity
      ansible.builtin.assert:
        that:
          - sops_age_identity.stat.exists
          - sops_age_identity.stat.isreg
        fail_msg: >-
          Missing key.txt. Restore the gitignored SOPS age identity before
          bootstrapping the cluster.

    - name: Seed the Argo CD SOPS age identity
      kubernetes.core.k8s:
        state: present
        apply: true
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: argocd
          type: Opaque
          stringData:
            keys.txt: "{{ lookup('ansible.builtin.file', playbook_dir + '/../key.txt') }}"
      no_log: true

    - name: Render ArgoCD manifests from Helm chart
      kubernetes.core.helm_template:
        chart_ref: ./argocd
        include_crds: true
        release_name: argocd
        release_namespace: argocd
        dependency_update: true
        values_files:
          - "argocd/values.yaml"
      register: argocd_manifests

    - name: Apply ArgoCD manifests
      kubernetes.core.k8s:
        resource_definition: "{{ argocd_manifests.stdout }}"
        apply: true
        server_side_apply:
          field_manager: argocd-application-controller
          force_conflicts: true
