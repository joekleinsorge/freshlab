apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: freshlab-health
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: freshlab.capacity
      rules:
        - alert: FreshlabNodeMemoryLow
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ `{{ $labels.instance }}` }} has less than 10% memory available"
            description: "Memory pressure is approaching eviction thresholds."
        - alert: FreshlabNodeFilesystemLow
          # NFS shares are mounted on every node. Aggregate those mounts so a
          # single full share produces one alert rather than one per node.
          expr: (min by (device, mountpoint) (node_filesystem_avail_bytes{fstype=~"nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} / node_filesystem_size_bytes{fstype=~"nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"}) < 0.25) or (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} < 0.25)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem {{ `{{ $labels.mountpoint }}` }} on {{ `{{ $labels.device }}` }} is below 25% free"
            description: "Free space on {{ `{{ $labels.mountpoint }}` }} is approaching the Longhorn safety reserve."
        - alert: FreshlabNodeFilesystemCritical
          expr: (min by (device, mountpoint) (node_filesystem_avail_bytes{fstype=~"nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} / node_filesystem_size_bytes{fstype=~"nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"}) < 0.15) or (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nfs|nfs4",mountpoint!~"/var/lib/kubelet/.+"} < 0.15)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Filesystem {{ `{{ $labels.mountpoint }}` }} on {{ `{{ $labels.device }}` }} is below 15% free"
            description: "Immediate cleanup or expansion is required before kubelet begins evicting workloads."
        - alert: FreshlabNodeFilesystemWillFill
          expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem on {{ `{{ $labels.instance }}` }} may fill within 24 hours"
            description: "Current growth on {{ `{{ $labels.mountpoint }}` }} will exhaust available space."
        - alert: FreshlabNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ `{{ $labels.node }}` }} is under disk pressure"
            description: "Kubelet has entered DiskPressure and may evict application pods."
        - alert: FreshlabSSDHealthFailure
          expr: smartctl_device_smart_status != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SSD {{ `{{ $labels.device }}` }} on {{ `{{ $labels.instance }}` }} reports failure"
            description: "SMART health has failed; replace the disk before Longhorn exhausts replica redundancy."
        - alert: FreshlabSSDHealthMetricsMissing
          expr: count(smartctl_device_smart_status) < 4
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "SMART telemetry is missing from one or more cluster nodes"
            description: "Fewer than four node disks are currently publishing SMART health."
        - alert: FreshlabSSDTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SSD {{ `{{ $labels.device }}` }} on {{ `{{ $labels.instance }}` }} is hot"
            description: "Drive temperature has remained above 65 degrees Celsius."
        - alert: FreshlabSMARTMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Drive {{ `{{ $labels.device }}` }} on {{ `{{ $labels.instance }}` }} has media errors"
            description: "SMART reports one or more uncorrectable media errors; replace the drive after confirming backups and replica health."
        - alert: FreshlabNVMeCriticalWarning
          expr: smartctl_device_critical_warning > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ `{{ $labels.device }}` }} on {{ `{{ $labels.instance }}` }} has a critical warning"
            description: "The NVMe controller reports a critical SMART warning."
        - alert: FreshlabNodeLinkBelowGigabit
          expr: (node_ethtool_speed{device!~"lo|veth.*|cali.*|cilium.*|lxc.*"} > 0) and (node_ethtool_speed{device!~"lo|veth.*|cali.*|cilium.*|lxc.*"} < 1000000000)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Network link {{ `{{ $labels.device }}` }} on {{ `{{ $labels.instance }}` }} is below 1 Gb/s"
            description: "The NIC's negotiated link speed is below gigabit, which can constrain Longhorn replication and cluster traffic."
    - name: freshlab.longhorn
      rules:
        - alert: FreshlabLonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="degraded"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ `{{ $labels.pvc_namespace }}` }}/{{ `{{ $labels.pvc }}` }} is degraded"
            description: "At least one replica is unavailable; the volume has reduced node-failure tolerance."
        - alert: FreshlabLonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="faulted"}) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ `{{ $labels.pvc_namespace }}` }}/{{ `{{ $labels.pvc }}` }} is faulted"
            description: "The volume is unavailable or at immediate risk of data loss."
        - alert: FreshlabLonghornDiskUnschedulable
          expr: longhorn_disk_status{condition="schedulable"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk on {{ `{{ $labels.node }}` }} cannot schedule replicas"
            description: "Capacity or disk health prevents Longhorn from maintaining replica redundancy."
        - alert: FreshlabLonghornDiskCapacityLow
          expr: (longhorn_disk_capacity_bytes - longhorn_disk_usage_bytes - longhorn_disk_reservation_bytes) / longhorn_disk_capacity_bytes < 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk on {{ `{{ $labels.node }}` }} has less than 25% usable capacity"
            description: "Replica rebuilds may soon be blocked by the configured storage reserve."
    - name: freshlab.workloads
      rules:
        - alert: FreshlabApplicationEndpointDown
          expr: probe_success{job="blackbox-http"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Application endpoint {{ `{{ $labels.instance }}` }} is unavailable"
            description: "The HTTPS health probe has failed continuously for five minutes."
        - alert: FreshlabPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) >= 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.pod }}` }} is crash-looping"
            description: "Container {{ `{{ $labels.container }}` }} has remained in CrashLoopBackOff."
        - alert: FreshlabPersistentVolumeDegraded
          expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.persistentvolumeclaim }}` }} is not bound"
            description: "Application storage has not been available for ten minutes."
        - alert: FreshlabPersistentVolumeLowSpace
          # kubelet is authoritative for PVC capacity. Filtering avoids a
          # duplicate copy of each alert from API-server exported metrics.
          expr: kubelet_volume_stats_available_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} < 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.persistentvolumeclaim }}` }} is below 25% free"
            description: "Expand or clean up this application volume before it can no longer write data."
        - alert: FreshlabPersistentVolumeCriticalSpace
          expr: kubelet_volume_stats_available_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.persistentvolumeclaim }}` }} is below 10% free"
            description: "Immediate cleanup or expansion is required to prevent application write failures."
        - alert: FreshlabPersistentVolumeWillFill
          expr: predict_linear(kubelet_volume_stats_available_bytes[6h], 3 * 24 * 3600) < 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.persistentvolumeclaim }}` }} may fill within three days"
            description: "Current data growth is projected to exhaust this application volume within three days."
