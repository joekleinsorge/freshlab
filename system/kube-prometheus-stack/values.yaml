kube-prometheus-stack:
  # k3s runs these control-plane components inside the server process rather
  # than as separately scrapeable pods. Disable the upstream alerts that
  # would otherwise report them as down even while the cluster is healthy.
  kubeProxy:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
        smtp_smarthost: smtp.gmail.com:587
        smtp_from: josephkleinsorge@gmail.com
        smtp_auth_username: josephkleinsorge@gmail.com
        smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-auth-password
        smtp_require_tls: true
      route:
        receiver: email
        group_by:
          - alertname
          - namespace
          - persistentvolumeclaim
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: "null"
        - name: email
          email_configs:
            - to: josephkleinsorge@gmail.com
              headers:
                subject: '{{ template "freshlab.email.subject" . }}'
              html: '{{ template "freshlab.email.html" . }}'
              send_resolved: true
          webhook_configs:
            - url: http://freshlab-alertmanager-eventsource-svc.argocd.svc.cluster.local:12000/alerts
              send_resolved: false
      templates:
        - /etc/alertmanager/config/*.tmpl
    templateFiles:
      freshlab-email.tmpl: |-
        {{ define "freshlab.email.subject" }}[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} — {{ . }}{{ end }}{{ end }}

        {{ define "freshlab.email.html" }}
        <!doctype html>
        <html>
        <body style="margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.45">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:28px 12px">
            <tr><td align="center">
              <table role="presentation" width="620" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border:1px solid #dfe3e8;border-radius:10px;overflow:hidden">
                <tr>
                  <td style="padding:18px 22px;background:#17202a;color:#ffffff;font-size:18px;font-weight:700">Freshlab alert</td>
                  <td align="right" style="padding:18px 22px;background:#17202a;color:{{ if eq .Status "firing" }}#ffb4b4{{ else }}#a7f3d0{{ end }};font-size:13px;font-weight:700;letter-spacing:.06em">{{ .Status | toUpper }}</td>
                </tr>
                <tr><td colspan="2" style="padding:22px">
                  <div style="font-size:20px;font-weight:700;margin-bottom:6px">{{ .CommonLabels.alertname }}</div>
                  <div style="color:#64748b;font-size:13px;margin-bottom:18px">{{ len .Alerts.Firing }} firing · {{ len .Alerts.Resolved }} resolved</div>
                  {{ range .Alerts.Firing }}
                  <div style="border-left:4px solid #dc2626;padding:10px 14px;margin:0 0 12px;background:#fff7f7">
                    <div style="font-weight:650">{{ .Annotations.summary }}</div>
                    {{ with .Annotations.description }}<div style="margin-top:4px;color:#475569;font-size:14px">{{ . }}</div>{{ end }}
                    {{ with .GeneratorURL }}<div style="margin-top:8px;font-size:13px"><a href="{{ . }}" style="color:#2563eb">View alert details</a></div>{{ end }}
                  </div>
                  {{ end }}
                  {{ range .Alerts.Resolved }}
                  <div style="border-left:4px solid #16a34a;padding:10px 14px;margin:0 0 12px;background:#f0fdf4">
                    <div style="font-weight:650">Resolved: {{ .Annotations.summary }}</div>
                  </div>
                  {{ end }}
                  <div style="margin-top:20px;padding-top:14px;border-top:1px solid #e2e8f0;color:#64748b;font-size:12px">Sent by Freshlab Alertmanager</div>
                </td></tr>
              </table>
            </td></tr>
          </table>
        </body>
        </html>
        {{ end }}
    alertmanagerSpec:
      secrets:
        - alertmanager-smtp
      retention: 120h
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 384Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-retain
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
  prometheus-node-exporter:
    extraArgs:
      - --collector.systemd
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.netclass.ignored-devices=^(veth.*|cali.*|tunl.*|dummy.*)$
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node-exporter/textfile_collector
      - --collector.cpu.info
      - --collector.ethtool
      - --collector.meminfo_numa
      - --collector.network_route
      - --collector.schedstat
      - --collector.thermal_zone
    extraHostVolumeMounts:
      - name: textfile-collector
        hostPath: /var/lib/node_exporter/textfile_collector
        type: DirectoryOrCreate
        mountPath: /var/lib/node-exporter/textfile_collector
        readOnly: true
    resources:
      limits:
        cpu: 250m
        memory: 180Mi
      requests:
        cpu: 100m
        memory: 50Mi
    serviceMonitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
      scrapeTimeout: 30s
      interval: 30s
  kube-state-metrics:
    prometheus:
      monitor:
        # Full Kubernetes object-state scrapes can exceed the chart's default
        # 10-second timeout while the cluster is reconciling many resources.
        scrapeTimeout: 30s
  grafana:
    admin:
      existingSecret: grafana-admin-credentials
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    ingress:
      enabled: true
      ingressClassName: istio
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        hajimari.io/appName: Grafana
        hajimari.io/icon: simple-icons:grafana
      hosts:
        - &host grafana-monitoring.kleinsorge.dev
      tls:
        - secretName: grafana-general-tls
          hosts:
            - *host
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
      - name: Tempo
        type: tempo
        url: http://tempo.tempo:3200
        access: proxy
        basicAuth: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: Loki
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: prometheus
    grafana.ini:
      server:
        root_url: https://grafana-monitoring.kleinsorge.dev
      auth:
        disable_login_form: false
        oauth_auto_login: false
      security:
        allow_embedding: true
        cookie_secure: true
        strict_transport_security: true
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false
        check_for_updates: false
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/default-home.json
      unified_alerting:
        enabled: true
    resources:
      limits:
        cpu: 300m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 128Mi
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: longhorn-retain
  prometheus:
    prometheusSpec:
      # Allow slow WAL replay on restart without startup probe flapping.
      maximumStartupDurationSeconds: 3600
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleNamespaceSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      probeNamespaceSelector: {}
      retention: 15d
      retentionSize: "10GB"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal0
      resources:
        requests:
          cpu: 500m
          # Prometheus settles above 5 GiB and can peak higher while replaying
          # its WAL. Reserve its real footprint so the scheduler cannot
          # overpack a 16 GiB control-plane node.
          memory: 6Gi
        limits:
          cpu: 1000m
          memory: 8Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-retain
            resources:
              requests:
                storage: 50Gi
      walCompression: true
      # Prometheus 3 no longer accepts remote-write-receiver as a feature
      # flag. Use the dedicated web flag exposed by Prometheus Operator.
      enableRemoteWriteReceiver: true
      additionalScrapeConfigs:
        - job_name: blackbox-http
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - https://argocd.kleinsorge.dev
                - https://authelia.kleinsorge.dev
                - https://budget.kleinsorge.dev
                - https://dex.kleinsorge.dev
                - https://draw.kleinsorge.dev
                - https://files.kleinsorge.dev
                - https://flask.kleinsorge.dev
                - https://frigate.kleinsorge.dev
                - https://grafana-monitoring.kleinsorge.dev
                - https://grocy.kleinsorge.dev
                - https://home.kleinsorge.dev
                - https://kindle-weather.kleinsorge.dev
                - https://kitchenowl.kleinsorge.dev
                - https://kiali.kleinsorge.dev
                - https://mealie.kleinsorge.dev
                - https://photos.kleinsorge.dev
                - https://plex.kleinsorge.dev/identity
                - https://rss.kleinsorge.dev
                - https://speed.kleinsorge.dev
                - https://status.kleinsorge.dev
                - https://tools.kleinsorge.dev
                - https://view.kleinsorge.dev
                - https://web.kleinsorge.dev
                - https://workflows.kleinsorge.dev
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: kube-prometheus-stack-prometheus-blackbox-exporter.kube-prometheus-stack.svc.cluster.local:9115

grafanaGateway:
  enabled: true
  host: grafana-monitoring.kleinsorge.dev
  serviceName: kube-prometheus-stack-grafana
  servicePort: 80
  tlsSecretName: grafana-monitoring-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  loadBalancerPool: ""

prometheus-blackbox-exporter:
  enabled: true
