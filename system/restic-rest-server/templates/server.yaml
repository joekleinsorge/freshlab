apiVersion: v1
kind: PersistentVolume
metadata:
  name: restic-backups-nfs
spec:
  capacity:
    storage: {{ .Values.nfs.capacity }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.path }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-backups
spec:
  storageClassName: ""
  volumeName: restic-backups-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.nfs.capacity }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-rest-server
  labels:
    app.kubernetes.io/name: restic-rest-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-rest-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-rest-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rest-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PASSWORD_FILE
              value: /credentials/.htpasswd
            - name: OPTIONS
              value: --path /data/restic --private-repos --prometheus --prometheus-no-auth --log -
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: backup-data
              mountPath: /data
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: restic-backups
        - name: credentials
          secret:
            secretName: restic-rest-server-auth
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: restic-rest-server
  labels:
    app.kubernetes.io/name: restic-rest-server
spec:
  selector:
    app.kubernetes.io/name: restic-rest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: restic-rest-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-rest-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-volsync-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restic-rest-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
{{ toYaml .Values.backupNamespaces | indent 18 }}
      ports:
        - port: 8000
          protocol: TCP
