external-dns:
  provider: cloudflare
  # Preserve the pre-1.22 default now that the chart requires an explicit policy.
  policy: upsert-only
  txtOwnerId: freshlab
  sources:
    - service
    - gateway-httproute
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token-secret
          key: api-token
  extraArgs:
    - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
