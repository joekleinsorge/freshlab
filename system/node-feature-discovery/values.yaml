node-feature-discovery:
  master:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  worker:
    # NFD must label every node before feature-based workloads can be safely
    # scheduled. Keep it above ordinary application pods, but below Longhorn
    # and Kubernetes-reserved priorities so it cannot displace core storage or
    # control-plane services during memory pressure.
    priorityClassName: freshlab-node-agent
    # Keep node labels current on the dedicated low-bandwidth node as well.
    tolerations:
      - key: freshlab.io/network-speed
        operator: Equal
        value: 100m
        effect: NoSchedule
    # An empty JSON object preserves the chart's valid default worker config.
    # The chart serializes this field into the config file consumed by NFD.
    config: {}
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
