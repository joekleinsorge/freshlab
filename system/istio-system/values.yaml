base:
  defaultRevision: default

istiod:
  profile: ambient
  global:
    hub: docker.io/istio
    proxy:
      holdApplicationUntilProxyStarts: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
  meshConfig:
    accessLogFile: /dev/stdout
    enablePrometheusMerge: true
    ingressClass: istio
    ingressSelector: istio
    ingressService: istio-ingressgateway
    defaultConfig:
      tracing: {}
    extensionProviders:
      - name: otel
        opentelemetry:
          service: opentelemetry-collector.opentelemetry.svc.cluster.local
          port: 4317
  pilot:
    cni:
      enabled: true
    autoscaleEnabled: true
    autoscaleMin: 1
    autoscaleMax: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

cni:
  profile: ambient
  # Cilium's Helm-managed CNI files live in the standard host paths even on
  # k3s. Istio must chain into that same conflist rather than k3s' bundled path.
  cniBinDir: /opt/cni/bin
  cniConfDir: /etc/cni/net.d
  ambient:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

ztunnel:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Public applications attached to the shared ambient-mode Gateway. Keeping
# this inventory here gives every app the same routing and mesh policy.
privilegedNamespaces:
  # Plex already needs direct access to /dev/dri. qBittorrent Gluetun
  # sidecar additionally needs NET_ADMIN and /dev/net/tun for WireGuard.
  - plex
  - qbittorrent

appRoutes:
  - {namespace: authelia, name: authelia, hostname: authelia.kleinsorge.dev, service: authelia, port: 80}
  - {namespace: budget, name: budget, hostname: budget.kleinsorge.dev, service: budget, port: 5006}
  - {namespace: dex, name: dex, hostname: dex.kleinsorge.dev, service: dex, port: 5556}
  - {namespace: disney-alerts, name: disney-alerts, hostname: disney-alerts.kleinsorge.dev, service: disney-alerts, port: 80}
  - {namespace: excalidraw, name: excalidraw, hostname: draw.kleinsorge.dev, service: excalidraw, port: 80}
  - {namespace: flask, name: flask, hostname: flask.kleinsorge.dev, service: flask-cache, port: 80}
  # These workloads use kubelet TCP probes. Keep them outside ambient mode:
  # pod-IP probe traffic is not reliably delivered through the Cilium/Istio
  # chained datapath on this cluster.
  - {namespace: freshrss, name: freshrss, hostname: rss.kleinsorge.dev, service: freshrss, port: 80, dataplaneMode: none}
  - {namespace: frigate, name: frigate, hostname: frigate.kleinsorge.dev, service: frigate, port: 5000}
  - {namespace: grafana, name: grafana, hostname: grafana.kleinsorge.dev, service: grafana, port: 80}
  - {namespace: grocy, name: grocy, hostname: grocy.kleinsorge.dev, service: grocy, port: 80}
  - {namespace: homepage, name: homepage, hostname: home.kleinsorge.dev, service: homepage, port: 3000, dataplaneMode: none}
  - {namespace: hermes, name: hermes, hostname: hermes.kleinsorge.dev, service: hermes, port: 9119, dataplaneMode: none}
