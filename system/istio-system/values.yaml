  - {namespace: kindle-weather, name: kindle-weather, hostname: kindle-weather.kleinsorge.dev, service: kindle-weather-service, port: 80}
  - {namespace: kitchenowl, name: kitchenowl, hostname: kitchenowl.kleinsorge.dev, service: kitchenowl, port: 80}
  - {namespace: kiali, name: kiali, hostname: kiali.kleinsorge.dev, service: kiali, port: 20001}
  - {namespace: kube-ops-view, name: kube-ops-view, hostname: view.kleinsorge.dev, service: kube-ops-view, port: 8080, dataplaneMode: none}
  - {namespace: librespeed, name: librespeed, hostname: speed.kleinsorge.dev, service: librespeed, port: 80}
  - {namespace: mealie, name: mealie, hostname: mealie.kleinsorge.dev, service: mealie, port: 9000}
  - {namespace: nginx, name: nginx, hostname: web.kleinsorge.dev, service: nginx-service, port: 80}
  - {namespace: autobrr, name: autobrr, hostname: autobrr.kleinsorge.dev, service: autobrr, port: 7474, dataplaneMode: none}
  - {namespace: bazarr, name: bazarr, hostname: bazarr.kleinsorge.dev, service: bazarr, port: 6767, dataplaneMode: none}
  - {namespace: plex, name: plex, hostname: plex.kleinsorge.dev, service: plex, port: 32400}
  - {namespace: prowlarr, name: prowlarr, hostname: prowlarr.kleinsorge.dev, service: prowlarr, port: 9696, dataplaneMode: none}
  - {namespace: qbittorrent, name: qbittorrent, hostname: qbittorrent.kleinsorge.dev, service: qbittorrent, port: 8080, dataplaneMode: none}
