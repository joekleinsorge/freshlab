apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: freshlab-wildcard
  namespace: istio-system
spec:
  secretName: freshlab-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.kleinsorge.dev"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: freshlab
  namespace: istio-system
  annotations:
    # Gateway API sources read DNS targets from the Gateway, not HTTPRoutes.
    external-dns.kubernetes.io/target: {{ .Values.publicGatewayAddress | quote }}
spec:
  # Istio's Gateway API controller owns the generated Deployment. Attach the
  # scheduling policy through its supported infrastructure overlay instead of
  # patching that generated Deployment imperatively.
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: freshlab-gateway-infrastructure
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: {{ .Values.publicGatewayAddress | quote }}
  listeners:
    - name: http
      hostname: "*.kleinsorge.dev"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.kleinsorge.dev"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: freshlab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freshlab-gateway-infrastructure
  namespace: istio-system
data:
  deployment: |
    spec:
      template:
        spec:
          # The public gateway is essential infrastructure and is lightweight
          # (64 MiB requested). It may run on metal0 when control-plane nodes
          # are memory-constrained, rather than leaving every public app down.
          tolerations:
            - key: freshlab.io/network-speed
              operator: Equal
              value: 100m
              effect: NoSchedule
