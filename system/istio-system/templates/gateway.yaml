apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: freshlab-wildcard
  namespace: istio-system
spec:
  secretName: freshlab-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.kleinsorge.dev"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: freshlab
  namespace: istio-system
  annotations:
    # Gateway API sources read DNS targets from the Gateway, not HTTPRoutes.
    external-dns.kubernetes.io/target: {{ .Values.publicGatewayAddress | quote }}
spec:
  # Istio's Gateway API controller owns the generated Deployment. Attach the
  # scheduling policy through its supported infrastructure overlay instead of
  # patching that generated Deployment imperatively.
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: freshlab-gateway-infrastructure
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: {{ .Values.publicGatewayAddress | quote }}
  listeners:
    - name: http
      hostname: "*.kleinsorge.dev"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.kleinsorge.dev"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: freshlab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: freshlab-public-gateway
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Keeps the public ingress gateway schedulable ahead of ordinary workloads
  during a transient capacity event without using a reserved system priority.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: freshlab-public-gateway
  namespace: istio-system
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: freshlab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freshlab-gateway-infrastructure
  namespace: istio-system
data:
  deployment: |
    spec:
      # Two gateway pods provide continuity during a node restart or a
      # voluntary rollout. Required anti-affinity keeps their failure domains
      # separate; if only one node is usable, Kubernetes still retains one
      # ready ingress pod rather than taking the service completely down.
      replicas: 2
      minReadySeconds: 10
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 1
      template:
        spec:
          priorityClassName: freshlab-public-gateway
          # The public gateway is essential infrastructure and is lightweight
          # (64 MiB requested). It may run on metal0 when control-plane nodes
          # are memory-constrained, rather than leaving every public app down.
          tolerations:
            - key: freshlab.io/network-speed
              operator: Equal
              value: 100m
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      gateway.networking.k8s.io/gateway-name: freshlab
                  topologyKey: kubernetes.io/hostname
