apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freshlab-http-redirect
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: freshlab
      sectionName: http
  hostnames:
    - "*.kleinsorge.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- range .Values.appRoutes }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
  labels:
    istio.io/dataplane-mode: {{ .dataplaneMode | default "none" | quote }}
    pod-security.kubernetes.io/enforce: {{ if has .namespace $.Values.privilegedNamespaces }}privileged{{ else }}baseline{{ end }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
{{- if not .protected }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .hostname | quote }}
    external-dns.alpha.kubernetes.io/target: {{ $.Values.publicGatewayAddress | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: freshlab
      namespace: istio-system
      sectionName: https
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service }}
          port: {{ .port }}
          weight: 1
---
{{- end }}
{{- end }}
