argo-rollouts:
  installCRDs: true
  clusterInstall: true
  controller:
    # Keep the existing component name while upgrading the controller.
    component: server
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  dashboard:
    enabled: true
    httproute:
      enabled: true
      annotations:
        link.argocd.argoproj.io/external-link: "Open app|https://rollouts.kleinsorge.dev"
      parentRefs:
        - name: freshlab
          namespace: istio-system
          sectionName: https
      hostnames:
        - rollouts.kleinsorge.dev
