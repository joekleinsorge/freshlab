argo-rollouts:
  installCRDs: true
  clusterInstall: true
  controller:
    # The legacy chart omitted this label from its immutable selector. Argo CD
    # must replace only the Deployment during the one-time chart upgrade.
    component: server
    deploymentAnnotations:
      argocd.argoproj.io/sync-options: Replace=true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
