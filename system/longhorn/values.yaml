longhorn:
  preUpgradeChecker:
    jobEnabled: true
  defaultSettings:
    # When a node dies, delete its Deployment/StatefulSet pods so Longhorn can
    # detach their volumes and the pods restart elsewhere. "do-nothing" left 15
    # apps stuck for 43h when metal0 failed on 2026-10-04.
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    # Secondary applications use one local replica. Plex and Frigate retain
    # explicitly managed multi-node replicas.
    defaultReplicaCount: 1
    replicaAutoBalance: best-effort
    # Rebalance before a node approaches the 25% storage reserve.  This is
    # especially important while all Longhorn disks share their hosts' root
    # filesystems with k3s and etcd.
    replicaAutoBalanceDiskPressurePercentage: 70
    # Replicas must live on different nodes; a node loss must not remove both
    # copies of a volume.
    replicaSoftAntiAffinity: false
    # Reserve sufficient physical headroom while allowing Frigate's mostly
    # sparse restored 150Gi volume to maintain two replicas on the remaining
    # nodes during a worker outage.
    storageOverProvisioningPercentage: 110
    storageMinimalAvailablePercentage: 15
    storageReservedPercentageForDefaultDisk: 5
    # A transient replica-path stall previously exhausted Frigate's two
    # replicas.  Give a replica 20 seconds to recover, then replenish a lost
    # replica immediately rather than leaving a volume degraded for 10 minutes.
    engineReplicaTimeout:
      v1: 20
      v2: 20
    replicaReplenishmentWaitInterval: 0
    # Do not admit new stateful workloads without their requested redundancy.
    # This trades a pending pod for a recoverable volume instead of silently
    # running it with a single copy.
    allowVolumeCreationWithDegradedAvailability: false
    # An on-demand backup otherwise leaves its Longhorn snapshot behind.  On a
    # compact cluster, a retained media snapshot can consume enough space to
    # prevent replica rebuilds even though the backup itself has completed.
    autoCleanupSnapshotAfterOnDemandBackupCompleted: true
    autoSalvage: true
    autoDeletePodWhenVolumeDetachedUnexpectedly: true
    disableSchedulingOnCordonedNode: true
    nodeDrainPolicy: block-if-contains-last-replica
    detachManuallyAttachedVolumesWhenCordoned: true
    # System-managed Longhorn components (CSI and engine-image DaemonSets)
    # need the same explicit admission to the dedicated low-bandwidth node.
    taintToleration: freshlab.io/network-speed=100m:NoSchedule
  csi:
    attacherReplicaCount: 2
    provisionerReplicaCount: 2
    resizerReplicaCount: 2
    snapshotterReplicaCount: 2
  longhornManager:
    # The upstream default permits every manager to restart together. On this
    # compact control plane that floods etcd and temporarily removes the
    # admission webhook. Roll one manager at a time instead.
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: freshlab.io/network-speed
        operator: Equal
        value: 100m
        effect: NoSchedule
  longhornDriver:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: freshlab.io/network-speed
        operator: Equal
        value: 100m
        effect: NoSchedule
  metrics:
    serviceMonitor:
      enabled: true
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2

snapshot-controller:
  controller:
    # VolumeGroupSnapshot CRDs are not installed in this cluster.
    args:
      featureGates: ""
