longhorn:
  preUpgradeChecker:
    jobEnabled: true
  defaultSettings:
    # When a node dies, delete its Deployment/StatefulSet pods so Longhorn can
    # detach their volumes and the pods restart elsewhere. "do-nothing" left 15
    # apps stuck for 43h when metal0 failed on 2026-10-04.
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    # One rebuild per node: parallel rebuilds plus image pulls saturated metal2's
    # NVMe, which etcd shares, and knocked the node NotReady (2026-10-05).
    concurrentReplicaRebuildPerNodeLimit: 1
    # New volumes default to two copies; explicitly disposable volumes can
    # opt out. Existing per-volume replica counts require separate migration.
    defaultReplicaCount: 2
    replicaAutoBalance: best-effort
    # This threshold only balances between disks within one node. It does not
    # evacuate a full single-disk node; free-space checks provide that warning.
    replicaAutoBalanceDiskPressurePercentage: 70
    # Replicas must live on different nodes; a node loss must not remove both
    # copies of a volume.
    replicaSoftAntiAffinity: false
    # Do not rely on thin provisioning to fit another recovery replica.
    storageOverProvisioningPercentage: 100
    # Longhorn shares each root filesystem with the kubelet, which soft-evicts
    # at 15% free and holds DiskPressure until 17% (eviction-minimum-reclaim).
    # At 15% here, rebuilds during metal0's outage filled metal3 into that band
    # and the kubelet evicted longhorn-manager, faulting four volumes
    # (2026-10-10).  Stay above the band with room for logs and images.
    storageMinimalAvailablePercentage: 25
    # Applies when creating a default disk. Existing disks require a reviewed
    # reservation update; changing this value does not resize or delete data.
    storageReservedPercentageForDefaultDisk: 30
    # A transient replica-path stall previously exhausted Frigate's two
    # replicas.  Give a replica 20 seconds to recover before it is failed.
    engineReplicaTimeout:
      v1: "20"
      v2: "20"
    # Wait 10 minutes for a failed replica's node to return and reuse that
    # replica, instead of rebuilding every replica of a missing node at once.
    # With 0, a hung metal1 (2026-11-27) set off rebuilds onto the other
    # control-plane disks; the writes held metal2's NVMe at 79 C with 30 s write
    # timeouts, etcd lost quorum and the cluster went down (NODE-002).
    replicaReplenishmentWaitInterval: 600
    # Do not admit new stateful workloads without their requested redundancy.
    # This trades a pending pod for a recoverable volume instead of silently
    # running it with a single copy.
    allowVolumeCreationWithDegradedAvailability: false
    # An on-demand backup otherwise leaves its Longhorn snapshot behind.  On a
    # compact cluster, a retained media snapshot can consume enough space to
    # prevent replica rebuilds even though the backup itself has completed.
    autoCleanupSnapshotAfterOnDemandBackupCompleted: true
    # Delete replica data and instances that no volume references once they have
    # been orphaned for a day.  On 2026-11-27, 243 GB of stale replica directories
    # (including 101 GB from a deleted volume) pushed metal0 into kubelet
    # DiskPressure; it evicted the instance manager and faulted the volumes on
    # it (NODE-002).  Orphans on failed or unknown nodes are never auto-deleted.
    orphanResourceAutoDeletion: "replica-data;instance"
    orphanResourceAutoDeletionGracePeriod: 86400
    autoSalvage: true
    autoDeletePodWhenVolumeDetachedUnexpectedly: true
    disableSchedulingOnCordonedNode: true
    nodeDrainPolicy: block-if-contains-last-replica
    detachManuallyAttachedVolumesWhenCordoned: true
    # System-managed Longhorn components (CSI and engine-image DaemonSets)
    # need the same explicit admission to the dedicated low-bandwidth node.
    taintToleration: freshlab.io/network-speed=100m:NoSchedule
  csi:
    attacherReplicaCount: 2
    provisionerReplicaCount: 2
    resizerReplicaCount: 2
    snapshotterReplicaCount: 2
  longhornManager:
    # The upstream default permits every manager to restart together. On this
    # compact control plane that floods etcd and temporarily removes the
    # admission webhook. Roll one manager at a time instead.
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: freshlab.io/network-speed
        operator: Equal
        value: 100m
        effect: NoSchedule
  longhornDriver:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: freshlab.io/network-speed
        operator: Equal
        value: 100m
        effect: NoSchedule
  metrics:
    serviceMonitor:
      enabled: true
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2

snapshot-controller:
  controller:
    # VolumeGroupSnapshot CRDs are not installed in this cluster.
    args:
      featureGates: ""
