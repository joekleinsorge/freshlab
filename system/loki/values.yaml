loki:
  nameOverride: loki
  deploymentMode: Monolithic

  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    storage:
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
    schemaConfig:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6
    compactor:
      retention_enabled: true
    serviceMonitor:
      enabled: true
  singleBinary:
    enabled: true
    replicas: 1
    persistence:
      enabled: false
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  test:
    enabled: false
