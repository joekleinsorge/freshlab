apiVersion: v1
kind: ServiceAccount
metadata:
  name: freshlab-host-health
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: freshlab-host-health
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events, namespaces, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, workflows, cronworkflows]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, snapshots, engines]
    verbs: [get, list, watch]
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: freshlab-host-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: freshlab-host-health
subjects:
  - kind: ServiceAccount
    name: freshlab-host-health
    namespace: argocd
