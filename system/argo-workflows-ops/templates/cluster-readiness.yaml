apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: freshlab-cluster-readiness
spec:
  entrypoint: readiness
  serviceAccountName: freshlab-ops-readonly
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
      - name: timeout
        value: 5m
  templates:
    - name: readiness
      inputs:
        parameters:
          - name: timeout
      container:
        # The script needs a shell; the upstream kubectl image is distroless.
        image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
        command:
          - /bin/sh
          - -ec
        args:
          - |
            kubectl wait nodes --all --for=condition=Ready --timeout="$TIMEOUT"
            kubectl wait applications.argoproj.io --all --namespace=argocd \
              --for=jsonpath='{.status.health.status}'=Healthy --timeout="$TIMEOUT"
        env:
          - name: TIMEOUT
            value: '{{ "{{inputs.parameters.timeout}}" }}'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          # The image defaults to root, which runAsNonRoot rejects.
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
