apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: freshlab-cluster-readiness
spec:
  entrypoint: readiness
  serviceAccountName: freshlab-ops-readonly
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
      - name: timeout
        value: 5m
  templates:
    - name: readiness
      inputs:
        parameters:
          - name: timeout
      container:
        image: registry.k8s.io/kubectl:v1.36.4@sha256:b8d523e7b8cdc5e3caa0f8891ee9f504abf137dec786e6e0ddd33e4f272c2f13
        command:
          - /bin/sh
          - -ec
        args:
          - |
            kubectl wait nodes --all --for=condition=Ready --timeout="$TIMEOUT"
            kubectl wait applications.argoproj.io --all --namespace=argocd \
              --for=jsonpath='{.status.health.status}'=Healthy --timeout="$TIMEOUT"
        env:
          - name: TIMEOUT
            value: '{{ "{{inputs.parameters.timeout}}" }}'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
