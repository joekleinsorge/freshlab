tempo:
  replicas: 1
  tempo:
    tag: 3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    reportingEnabled: false
    retention: 72h
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    metricsGenerator:
      enabled: true
      remoteWriteUrl: http://kube-prometheus-stack-prometheus.kube-prometheus-stack:9090/api/v1/write
      processor:
        service_graphs: {}
        span_metrics: {}
      registry:
        external_labels:
          cluster: freshlab
      storage:
        path: /var/tempo/metrics
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  tempoQuery:
    tag: 3.1.0@sha256:79afd9acc2a8d03452a52bbe9afdf2ed05010882339ef983596e42917d6ef26e
  persistence:
    enabled: true
    storageClassName: longhorn-retain
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  serviceMonitor:
    enabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
