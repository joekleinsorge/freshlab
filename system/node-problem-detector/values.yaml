node-problem-detector:
  # Kernel, read-only-filesystem, and container-runtime monitors publish Node
  # Conditions and events before Kubernetes loses the node entirely.
  settings:
    prometheus_address: 0.0.0.0
    prometheus_port: 20257
    # The stock monitor treats a read-only remount of any block device as a
    # node failure. Longhorn presents workload PVCs as virtual SCSI disks, so
    # a damaged workload filesystem previously cordoned an otherwise healthy
    # node. Monitor only the host root logical volume instead.
    log_monitors:
      - /config/kernel-monitor.json
      - /config/docker-monitor.json
      - /custom-config/root-filesystem-readonly-monitor.json
    custom_monitor_definitions:
      root-filesystem-readonly-monitor.json: |
        {
          "plugin": "kmsg",
          "logPath": "/dev/kmsg",
          "lookback": "5m",
          "bufferSize": 10,
          "source": "root-filesystem-readonly-monitor",
          "metricsReporting": true,
          "conditions": [
            {
              "type": "ReadonlyFilesystem",
              "reason": "FilesystemIsNotReadOnly",
              "message": "Host root filesystem is not read-only"
            }
          ],
          "rules": [
            {
              "type": "permanent",
              "condition": "ReadonlyFilesystem",
              "reason": "FilesystemIsReadOnly",
              "pattern": "EXT4-fs \\(dm-0\\): Remounting filesystem read-only"
            }
          ]
        }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      attachMetadata:
        node: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
