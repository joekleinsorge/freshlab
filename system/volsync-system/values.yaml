volsync:
  # Pin both the controller and Restic mover to the exact image already
  # validated in-cluster. The controller passes this mover image to every
  # generated backup Job, satisfying the cluster's digest-only image policy.
  image:
    image: quay.io/backube/volsync@sha256:0d03a6aad57569eba2c0eaa0848cf4a908d9744b372ff2224bb291a320f36d76
  restic:
    image: quay.io/backube/volsync@sha256:0d03a6aad57569eba2c0eaa0848cf4a908d9744b372ff2224bb291a320f36d76
  metrics:
    # The chart's ServiceMonitor does not attach a bearer token, so its
    # kube-rbac-proxy endpoint otherwise returns 401 to Prometheus.
    disableAuth: true

backups:
  enabled: true
  # Admit the initial backup backlog in small batches. A completed volume is
  # then explicitly enabled on its staggered recurring schedule below.
  paused: true
  schedule: "17 */6 * * *"
  copyMethod: Snapshot
  # Mover Jobs are intentionally below serving workloads.  They previously
  # ran as BestEffort, allowing backup work to contend without bounds during
  # a storage recovery.
  moverResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  pruneIntervalDays: 14
  retain:
    hourly: 4
    daily: 7
    weekly: 4
    monthly: 6
    yearly: 2
  volumes:
    - {namespace: authelia, pvc: authelia-data, schedule: "7 0,6,12,18 * * *", paused: false}
    - {namespace: autobrr, pvc: autobrr-config, schedule: "22 0,6,12,18 * * *", paused: false}
    - {namespace: disney-alerts, pvc: disney-alerts-data, schedule: "37 0,6,12,18 * * *", paused: false}
    - namespace: freshrss
      pvc: freshrss-pvc
      schedule: "52 0,6,12,18 * * *"
      paused: false
      moverSecurityContext: &uid1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: frigate
      pvc: frigate-config
      schedule: "7 1,7,13,19 * * *"
      paused: false
      moverSecurityContext: &uid0
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    - namespace: frigate
      pvc: frigate-media
      schedule: "22 1,7,13,19 * * *"
      paused: false
      # Initial snapshot export is complete. Direct Restic copies make recurring
      # media backups incremental without another Longhorn snapshot export.
      copyMethod: Direct
      moverSecurityContext: *uid0
    - namespace: grocy
      pvc: grocy-data
      schedule: "37 1,7,13,19 * * *"
      paused: false
      moverSecurityContext: *uid1001
    - namespace: hermes
      pvc: hermes-data
      schedule: "52 1,7,13,19 * * *"
      paused: false
      moverSecurityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: immich
      pvc: immich-postgres-data
      schedule: "7 2,8,14,20 * * *"
      paused: false
      moverSecurityContext:
        runAsUser: 26
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - {namespace: kitchenowl, pvc: kitchenowl-data, schedule: "22 2,8,14,20 * * *", paused: false}
    - namespace: mealie
      pvc: mealie-data
      schedule: "37 2,8,14,20 * * *"
      paused: false
      # Mealie writes some historical database backups as UID/GID 1001 with
      # restrictive permissions. Match the workload identity so Restic can
      # read every file without granting the mover root access.
      moverSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: paperless
      pvc: paperless-data
      schedule: "52 2,8,14,20 * * *"
      paused: false
      moverSecurityContext: *uid0
    # Plex configuration is backed up to the established encrypted repository.
    - namespace: plex
      pvc: pms-config-plex-0
      schedule: "7 3,9,15,21 * * *"
      # A CSI snapshot gives Restic a stable point-in-time copy and permits its
      # resource-intensive scan to run away from Plex's live RWO attachment.
      paused: true
      copyMethod: Snapshot
      # Never let this multi-gigabyte mover share an etcd control-plane host.
      # If no worker has capacity, it remains pending instead of destabilizing
      # Kubernetes while Plex is serving clients.
      moverAffinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # The established Plex repository needs substantial memory while Restic
      # builds its metadata index. Keep a workload-specific ceiling so it can
      # complete without making other backup movers unbounded.
      moverResources:
        requests:
          cpu: 250m
          memory: 3Gi
        limits:
          cpu: "1"
          memory: 6Gi
      # Restic metadata for this established repository exceeds VolSync's 1Gi
      # default cache. This is controller-managed, disposable storage only.
      cacheCapacity: 5Gi
      moverSecurityContext:
        runAsUser: 911
        runAsGroup: 911
        runAsNonRoot: true
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The interrupted direct mover left this repository lock behind. VolSync
      # will run its safe Restic unlock workflow once before the next backup.
      unlock: plex-restic-lock-20260929
    - namespace: prowlarr
      pvc: prowlarr-config
      schedule: "22 3,9,15,21 * * *"
      paused: false
      moverSecurityContext: &uid3000
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: qbittorrent
      pvc: qbittorrent-config
      schedule: "37 3,9,15,21 * * *"
      paused: false
      moverSecurityContext: *uid3000
    - namespace: radarr
      pvc: radarr-config
      schedule: "52 3,9,15,21 * * *"
      paused: false
      moverSecurityContext: *uid3000
    - namespace: romm
      pvc: mysql-data-pvc
      schedule: "7 4,10,16,22 * * *"
      paused: false
      moverSecurityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: romm
      pvc: romm-redis-data-pvc
      schedule: "22 4,10,16,22 * * *"
      paused: false
      moverSecurityContext: *uid0
    - namespace: romm
      pvc: romm-resources-pvc
      schedule: "37 4,10,16,22 * * *"
      paused: false
      moverSecurityContext: *uid0
    - namespace: seerr
      pvc: seerr-config
      schedule: "52 4,10,16,22 * * *"
      paused: false
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - namespace: sonarr
      pvc: sonarr-config
      schedule: "7 5,11,17,23 * * *"
      paused: false
      moverSecurityContext: *uid3000
    - namespace: tautulli
      pvc: tautulli-config
      schedule: "22 5,11,17,23 * * *"
      paused: false
      moverSecurityContext: *uid3000
