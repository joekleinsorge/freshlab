volsync:
  metrics:
    # The chart's ServiceMonitor does not attach a bearer token, so its
    # kube-rbac-proxy endpoint otherwise returns 401 to Prometheus.
    disableAuth: true

backups:
  enabled: true
  # Admit the initial backup backlog in small batches. A completed volume is
  # then explicitly enabled on its staggered recurring schedule below.
  paused: true
  schedule: "17 */6 * * *"
  copyMethod: Snapshot
  pruneIntervalDays: 14
  retain:
    hourly: 4
    daily: 7
    weekly: 4
    monthly: 6
    yearly: 2
  volumes:
    - {namespace: authelia, pvc: authelia-data, schedule: "7 0,6,12,18 * * *"}
    - {namespace: autobrr, pvc: autobrr-config, schedule: "22 0,6,12,18 * * *", paused: false}
    - {namespace: disney-alerts, pvc: disney-alerts-data, schedule: "37 0,6,12,18 * * *"}
    - {namespace: freshrss, pvc: freshrss-pvc, schedule: "52 0,6,12,18 * * *"}
    - {namespace: frigate, pvc: frigate-config, schedule: "7 1,7,13,19 * * *"}
    - {namespace: frigate, pvc: frigate-media, schedule: "22 1,7,13,19 * * *"}
    - {namespace: grocy, pvc: grocy-data, schedule: "37 1,7,13,19 * * *"}
    - {namespace: hermes, pvc: hermes-data, schedule: "52 1,7,13,19 * * *"}
    - {namespace: immich, pvc: immich-postgres-data, schedule: "7 2,8,14,20 * * *"}
    - {namespace: kitchenowl, pvc: kitchenowl-data, schedule: "22 2,8,14,20 * * *"}
    - namespace: mealie
      pvc: mealie-data
      schedule: "37 2,8,14,20 * * *"
      # Mealie writes some historical database backups as UID/GID 1001 with
      # restrictive permissions. Match the workload identity so Restic can
      # read every file without granting the mover root access.
      moverSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - {namespace: paperless, pvc: paperless-data, schedule: "52 2,8,14,20 * * *"}
    # Plex configuration is small and changes while the server is live. A direct
    # Restic copy avoids snapshotting its live SQLite database and preserves the
    # normal encrypted, retained backup repository.
    - namespace: plex
      pvc: pms-config-plex-0
      schedule: "7 3,9,15,21 * * *"
      copyMethod: Direct
      moverSecurityContext:
        runAsUser: 911
        runAsGroup: 911
        runAsNonRoot: true
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    - {namespace: prowlarr, pvc: prowlarr-config, schedule: "22 3,9,15,21 * * *"}
    - {namespace: qbittorrent, pvc: qbittorrent-config, schedule: "37 3,9,15,21 * * *"}
    - {namespace: radarr, pvc: radarr-config, schedule: "52 3,9,15,21 * * *"}
    - {namespace: romm, pvc: mysql-data-pvc, schedule: "7 4,10,16,22 * * *"}
    - {namespace: romm, pvc: romm-redis-data-pvc, schedule: "22 4,10,16,22 * * *"}
    - {namespace: romm, pvc: romm-resources-pvc, schedule: "37 4,10,16,22 * * *"}
    - {namespace: seerr, pvc: seerr-config, schedule: "52 4,10,16,22 * * *"}
    - {namespace: sonarr, pvc: sonarr-config, schedule: "7 5,11,17,23 * * *"}
    - {namespace: tautulli, pvc: tautulli-config, schedule: "22 5,11,17,23 * * *"}
