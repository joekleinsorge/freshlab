volsync:
  # Pin both the controller and Restic mover to the exact image already
  # validated in-cluster. The controller passes this mover image to every
  # generated backup Job, satisfying the cluster's digest-only image policy.
  image:
    image: quay.io/backube/volsync@sha256:a9f2a7d697eada36b055ab956a371a39d37f803182762bb44df47bfa6ad54877
  restic:
    image: quay.io/backube/volsync@sha256:a9f2a7d697eada36b055ab956a371a39d37f803182762bb44df47bfa6ad54877
  metrics:
    # The chart's ServiceMonitor does not attach a bearer token, so its
    # kube-rbac-proxy endpoint otherwise returns 401 to Prometheus.
    disableAuth: true

backups:
  enabled: true
  # Admit the initial backup backlog in small batches. A completed volume is
  # then explicitly enabled on its staggered recurring schedule below.
  paused: true
  schedule: "17 */6 * * *"
  copyMethod: Snapshot
  # Mover Jobs are intentionally below serving workloads.  They previously
  # ran as BestEffort, allowing backup work to contend without bounds during
  # a storage recovery.
  moverResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  pruneIntervalDays: 14
  retain:
    hourly: 4
    daily: 7
    weekly: 4
    monthly: 6
    yearly: 2
  volumes:
    - namespace: frigate
      pvc: frigate-config
      schedule: "7 1,7,13,19 * * *"
      paused: false
      moverSecurityContext: &uid0
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    - namespace: frigate
      pvc: frigate-media
      # The original claim is faulted while metal0 is offline. Keep the
      # established ReplicationSource and repository names, but back up the
      # independently restored claim now used by Frigate.
      sourcePVC: frigate-media-restore-20261003
      schedule: "22 1,7,13,19 * * *"
      paused: false
      # Initial snapshot export is complete. Direct Restic copies make recurring
      # media backups incremental without another Longhorn snapshot export.
      copyMethod: Direct
      # The recovery mover left a stale repository lock; remove it once before
      # resuming recurring backups from the restored media claim.
      unlock: frigate-restic-lock-20261004
      moverSecurityContext: *uid0
    # Plex configuration is backed up to the established encrypted repository.
    - namespace: plex
      pvc: pms-config-plex-0
      schedule: "7 3,9,15,21 * * *"
      paused: false
      copyMethod: Snapshot
      # The established Plex repository needs substantial memory while Restic
      # builds its metadata index. Keep a workload-specific ceiling so it can
      # complete without making other backup movers unbounded.
      moverResources:
        requests:
          cpu: 250m
          memory: 3Gi
        limits:
          cpu: "1"
          memory: 6Gi
      # Restic metadata for this established repository exceeds VolSync's 1Gi
      # default cache. This is controller-managed, disposable storage only.
      cacheCapacity: 5Gi
      moverSecurityContext:
        runAsUser: 911
        runAsGroup: 911
        runAsNonRoot: true
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The interrupted direct mover left this repository lock behind. VolSync
      # will run its safe Restic unlock workflow once before the next backup.
      unlock: plex-restic-lock-20261004
