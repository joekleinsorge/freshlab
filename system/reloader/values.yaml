reloader:
  reloader:
    autoReloadAll: true
    watchGlobally: true
    # Prometheus Operator and Grafana sidecars hot-reload their generated
    # configuration. Restarting them for every Secret update causes needless
    # Prometheus WAL replays and monitoring outages.
    ignoreNamespaces: kube-prometheus-stack
    reloadOnCreate: true
    reloadOnDelete: true
    syncAfterRestart: true
    deployment:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    serviceMonitor:
      enabled: true
