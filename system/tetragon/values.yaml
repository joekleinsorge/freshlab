tetragon:
  enabled: true
  hostNetwork: true
  export:
    mode: stdout
  tetragon:
    clusterName: freshlab
    enableK8sAPI: true
    enableProcessCred: true
    enableProcessNs: true
    enablePolicyFilter: true
    exportAllowList: |-
      {"event_set":["PROCESS_EXEC", "PROCESS_EXIT", "PROCESS_KPROBE", "PROCESS_UPROBE", "PROCESS_TRACEPOINT", "PROCESS_LSM"]}
    exportDenyList: |-
      {"health_check":true}
      {"namespace":["", "cilium", "kube-system"]}
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        extraLabels:
          release: kube-prometheus-stack
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  tetragonOperator:
    enabled: true
    replicas: 1
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        extraLabels:
          release: kube-prometheus-stack
