kyverno:
  admissionController:
    replicas: 2
  backgroundController:
    replicas: 1
  cleanupController:
    replicas: 1
  reportsController:
    # Freshlab's custom policies use background: false and do not rely on
    # PolicyReport resources for enforcement. The reports controller repeatedly
    # loses its lease during API-server recovery, so leave it disabled rather
    # than adding API load and a permanent crash loop. Admission, background,
    # and cleanup controllers remain enabled and enforce policy normally.
    enabled: false
