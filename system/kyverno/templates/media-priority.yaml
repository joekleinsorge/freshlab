apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: freshlab-media-critical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
value: 900000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Plex and Frigate serving workloads preempt secondary applications.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: freshlab-media-workload-priority
spec:
  # Keep API-server defaults explicit so reconciliation does not report
  # defaulted fields as drift.
  admission: true
  background: false
  emitWarning: false
  validationFailureAction: Audit
  rules:
    - name: prioritize-plex
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - plex
              selector:
                matchLabels:
                  app.kubernetes.io/name: plex
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: freshlab-media-critical
      skipBackgroundRequests: true
    - name: prioritize-frigate
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - frigate
              selector:
                matchLabels:
                  app.kubernetes.io/name: frigate
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: freshlab-media-critical
      skipBackgroundRequests: true
