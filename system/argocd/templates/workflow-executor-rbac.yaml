apiVersion: v1
kind: ServiceAccount
metadata:
  name: freshlab-workflow-executor
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freshlab-workflow-executor
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freshlab-workflow-executor
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freshlab-workflow-executor
subjects:
  - kind: ServiceAccount
    name: freshlab-workflow-executor
    namespace: {{ .Release.Namespace }}
