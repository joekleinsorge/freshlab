{{- $gateways := list .Values.argocdGateway .Values.argoWorkflowsGateway }}
{{- range $gateway := $gateways }}
{{- if $gateway.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $gateway.tlsSecretName }}
  dnsNames:
    - {{ $gateway.host | quote }}
  issuerRef:
    name: {{ $gateway.issuerRef.name }}
    kind: {{ $gateway.issuerRef.kind }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ $gateway.host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ $gateway.address | quote }}
spec:
  # Istio owns the generated Deployment. Apply the availability policy via its
  # supported infrastructure overlay so a single node loss cannot remove this
  # gateway's only proxy pod.
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ printf "%s-gateway-infrastructure" $gateway.serviceName }}
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: {{ $gateway.address | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if and (eq $gateway.serviceName "argocd-server") $.Values.argocdMcp.enabled }}
    - name: mcp-https
      protocol: HTTPS
      port: 443
      hostname: {{ $.Values.argocdMcp.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-mcp-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gateway-redirect" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ printf "%s-gateway" $gateway.serviceName }}
      sectionName: http
  hostnames:
    - {{ $gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ printf "%s-gateway" $gateway.serviceName }}
      sectionName: https
  hostnames:
    - {{ $gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $gateway.serviceName }}
          port: {{ $gateway.servicePort }}
          weight: 1
---
{{- end }}
{{- end }}

{{- range $gateway := $gateways }}
{{- if $gateway.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ printf "%s-gateway" $gateway.serviceName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-gateway-infrastructure" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
data:
  deployment: |
    spec:
      replicas: 2
      minReadySeconds: 10
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 1
      template:
        spec:
          priorityClassName: freshlab-public-gateway
          tolerations:
            - key: freshlab.io/network-speed
              operator: Equal
              value: 100m
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      gateway.networking.k8s.io/gateway-name: {{ printf "%s-gateway" $gateway.serviceName }}
                  topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}
