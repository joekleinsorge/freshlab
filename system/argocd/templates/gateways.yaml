{{- $gateways := list .Values.argocdGateway .Values.argoWorkflowsGateway }}
{{- range $gateway := $gateways }}
{{- if $gateway.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $gateway.tlsSecretName }}
  dnsNames:
    - {{ $gateway.host | quote }}
  issuerRef:
    name: {{ $gateway.issuerRef.name }}
    kind: {{ $gateway.issuerRef.kind }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ $gateway.host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ $gateway.address | quote }}
spec:
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: {{ $gateway.address | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gateway-redirect" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ printf "%s-gateway" $gateway.serviceName }}
      sectionName: http
  hostnames:
    - {{ $gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-gateway" $gateway.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ printf "%s-gateway" $gateway.serviceName }}
      sectionName: https
  hostnames:
    - {{ $gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $gateway.serviceName }}
          port: {{ $gateway.servicePort }}
          weight: 1
---
{{- end }}
{{- end }}
