apiVersion: v1
kind: Namespace
metadata:
  name: freshlab-security-benchmarks
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: freshlab-security-benchmarks
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostPID: true
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.12.0@sha256:d079de1fa7f757b367c39ee12eafc0e8729e94962df2c29808f4b602a615c142
          command: [kube-bench]
          args: [run, --targets, "node,policies,managedservices"]
          securityContext:
            privileged: true
          volumeMounts:
            - {name: etc-systemd, mountPath: /etc/systemd, readOnly: true}
            - {name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true}
            - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
            - {name: var-lib-rancher, mountPath: /var/lib/rancher, readOnly: true}
      volumes:
        - name: etc-systemd
          hostPath: {path: /etc/systemd}
        - name: etc-kubernetes
          hostPath: {path: /etc/kubernetes}
        - name: var-lib-kubelet
          hostPath: {path: /var/lib/kubelet}
        - name: var-lib-rancher
          hostPath: {path: /var/lib/rancher}
