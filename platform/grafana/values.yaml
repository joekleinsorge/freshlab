grafana:
  freshlabAppDashboards:
    - budget
    - disney-alerts
    - excalidraw
    - flask
    - freshrss
    - frigate
    - grocy
    - hajimari
    - immich
    - kindle-weather
    - kitchenowl
    - kube-ops-view
    - librespeed
    - mealie
    - mqtt
    - nginx
    - plex
    - romm
    - seafile
    - tools
    - uptime-kuma
  ingress:
    enabled: true
    ingressClassName: istio
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.kleinsorge.dev
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      searchNamespace: grafana
  livenessProbe:
    initialDelaySeconds: 300
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.kleinsorge.dev
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.kleinsorge.dev/auth
      token_url: https://dex.kleinsorge.dev/token
      api_url: https://dex.kleinsorge.dev/userinfo
