grafana:
  ingress:
    enabled: true
    ingressClassName: istio
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.kleinsorge.dev
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
  additionalDataSources:
    - name: Tempo
      type: tempo
      url: http://tempo.tempo:3200
      access: proxy
      basicAuth: false
      jsonData:
        httpMethod: GET
        serviceMap:
          datasourceUid: prometheus
        tracesToLogsV2:
          datasourceUid: Loki
          filterByTraceID: true
          filterBySpanID: false
        tracesToMetrics:
          datasourceUid: prometheus
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.kleinsorge.dev
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.kleinsorge.dev/auth
      token_url: https://dex.kleinsorge.dev/token
      api_url: https://dex.kleinsorge.dev/userinfo
