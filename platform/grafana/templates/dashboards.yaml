{{- $files := .Files.Glob "dashboards/*.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: freshlab-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  annotations:
    grafana_folder: Freshlab
  labels:
    grafana_dashboard: "1"
data:
{{- range $path, $file := $files }}
  {{ base $path }}: |-
{{ $file | toString | nindent 4 }}
{{- end }}
