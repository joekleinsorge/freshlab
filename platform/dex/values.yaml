dex:
  image:
    tag: v2.45.1
  config:
    issuer: https://dex.kleinsorge.dev
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
    # Keep OIDC refresh tokens valid long enough that the configured clients
    # do not force an interactive login during normal day-to-day use.
    expiry:
      refreshTokens:
        validIfNotUsedFor: 2160h
        absoluteLifetime: 8760h
    enablePasswordDB: true
    staticPasswords:
      - email: admin@kleinsorge.dev
        hashFromEnv: DEX_ADMIN_PASSWORD_HASH
        username: admin
        name: Freshlab Administrator
        preferredUsername: admin
        emailVerified: true
        groups:
          - freshlab-admins
        userID: "1"
    staticClients:
      - id: grafana-sso
        name: Grafana
        redirectURIs:
          - 'https://grafana.kleinsorge.dev/login/generic_oauth'
        secretEnv: GRAFANA_SSO_CLIENT_SECRET
      - id: argocd-sso
        name: Argo CD
        redirectURIs:
          - 'https://argocd.kleinsorge.dev/auth/callback'
        secretEnv: ARGOCD_SSO_CLIENT_SECRET
      - id: argocd-cli
        name: Argo CD CLI
        # Public PKCE client used by `argocd login --sso`.
        public: true
        redirectURIs:
          - 'http://localhost:8085/auth/callback'
      - id: argo-workflows-sso
        name: Argo Workflows
        redirectURIs:
          - 'https://workflows.kleinsorge.dev/oauth2/callback'
        secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
      - id: disney-alerts-sso
        name: Disney Alerts
        redirectURIs:
          - 'https://disney-alerts.kleinsorge.dev/auth/callback'
        secretEnv: DISNEY_ALERTS_SSO_CLIENT_SECRET
      - id: mealie-sso
        name: Mealie
        redirectURIs:
          - 'https://mealie.kleinsorge.dev/login'
          - 'https://mealie.kleinsorge.dev/login?direct=1'
        secretEnv: MEALIE_SSO_CLIENT_SECRET
      - id: paperless-sso
        name: Paperless-ngx
        redirectURIs:
          - 'https://paperless.kleinsorge.dev/accounts/oidc/dex/login/callback/'
        secretEnv: PAPERLESS_SSO_CLIENT_SECRET
      - id: media-stack-sso
        name: Media Stack Gateway
        redirectURIs:
          - 'https://auth.kleinsorge.dev/oauth2/callback'
        secretEnv: MEDIA_STACK_SSO_CLIENT_SECRET
  envFrom:
    - secretRef:
        name: dex-secrets
  ingress:
    enabled: true
    className: istio
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      hajimari.io/appName: Dex
      hajimari.io/icon: mdi:key-chain
    hosts:
      - host: &host dex.kleinsorge.dev
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: dex-tls-certificate
        hosts:
          - *host
